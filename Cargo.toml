[package]
name = "xikomap"
version = "2.2.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ipnetwork = "0.20"
rand = "0.8"
pyo3 = { version = "0.20", features = ["auto-initialize"] }
reqwest = { version = "0.11", features = ["json"] }