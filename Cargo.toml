[package]
name = "xikomap"
version = "2.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
pyo3 = { version = "0.20", features = ["auto-initialize"] }
anyhow = "1.0"
ipnetwork = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"